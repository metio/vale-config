#
# Self-test config: lints against the local styles/ tree (rules + vocabulary).
# Consuming repos extract the released package into their StylesPath and use the
# same blocks — see README.md.
StylesPath = styles
MinAlertLevel = warning
Vocab = Metio

[*.md]
BasedOnStyles = Metio, Vale
Vale.Spelling = NO
Vale.Avoid = NO
