# Builds the Vale "complete package" (Metio.zip) and publishes it to a GitHub
# release marked latest, so consuming repos pull releases/latest/download/Metio.zip.
# A complete package is a top-level directory named after the package (Metio/)
# holding a .vale.ini plus a styles/ StylesPath (rules + config/vocabularies);
# `vale sync` merges that whole StylesPath, so the shared vocabulary and config
# travel with the rules. The blob is signed with cosign keyless (Fulcio OIDC),
# matching the metio release convention.
#
# The version is the release date plus a +HHMMSS build-metadata suffix, with the
# hour un-padded so the suffix never starts with a zero (e.g. 2026.6.16+93015 at
# 09:30:15). The metio convention for repos that release on push; the time suffix
# keeps every tag unique, so same-day re-runs don't collide with an existing
# immutable release. Consumers track `latest`, not a pinned tag, so the exact
# version string is cosmetic.
name: release
on:
  push:
    branches: [main]
    paths:
      - styles/**
      - .github/workflows/release.yml
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build complete package
        run: |
          mkdir -p dist/Metio
          cp .vale.ini dist/Metio/.vale.ini
          cp -r styles dist/Metio/styles
          ( cd dist && zip -r ../Metio.zip Metio )
          sha256sum Metio.zip > SHA256SUMS
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign the package
        run: cosign sign-blob --yes --bundle Metio.zip.cosign.bundle Metio.zip
      - name: Compute version
        id: version
        run: echo "value=$(date +'%Y.%-m.%-d+%-H%M%S')" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: ${{ steps.version.outputs.value }}
          make_latest: true
          files: |
            Metio.zip
            SHA256SUMS
            Metio.zip.cosign.bundle
